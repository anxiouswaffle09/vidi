[project]
name = "vidi"
version = "0.1.0"
description = "YouTube video analyzer powered by Google Gemini"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "google-genai>=1.0.0",
]

[project.scripts]
vidi = "vidi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidi"]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
